name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + lint + vitest + playwright
    runs-on: ubuntu-latest
    # Official Playwright image ships browsers + every apt system dep
    # pre-installed for the pinned Playwright version — skips ~30s of
    # `playwright install-deps` on every run. Bump this tag when the
    # @playwright/test dep version changes.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      # The image runs as root; without this, actions/cache and
      # actions/setup-node sometimes hit permission issues writing into
      # /github/home.
      options: --user 1001
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Warms `next build`'s incremental cache so Playwright's start:test
      # doesn't rebuild from scratch every run. Key on the lockfile +
      # source-file hash so dep or source changes invalidate;
      # restore-keys lets us fall back to a partial cache when only
      # source files changed.
      - name: Cache .next/cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.{ts,tsx,css}') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run

      - run: npm run test:e2e

      # Lighthouse uses the Chromium that already ships with the
      # Playwright image (saves a separate browser install). The binary's
      # directory name includes the pinned Chromium build number; glob it
      # so we don't have to bump the workflow when the image moves.
      - name: Discover Chrome for Lighthouse
        run: |
          CHROME_PATH=$(ls -d /ms-playwright/chromium-*/chrome-linux/chrome 2>/dev/null | head -1)
          if [ -z "$CHROME_PATH" ]; then
            echo "Could not find Chromium under /ms-playwright" >&2
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Lighthouse CI healthcheck
        run: npx lhci healthcheck

      - run: npm run test:lhci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14
